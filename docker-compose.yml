services:
  console-web:
    image: ghcr.io/podcctv/console-web:latest
    build:
      context: .
    working_dir: /app
    command: ["python", "main.py"]
    ports:
      - "8180:8080"
    volumes:
      - /opt/console-web/data:/app/data
      - /opt/console-web/logs:/app/logs
      - /opt/console-web/certs:/app/certs
    restart: unless-stopped

